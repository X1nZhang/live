name: Fetch Live Status
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rooms.json']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- B站：Node.js 直连（已验证稳定） ----
      - name: Fetch Bilibili status
        run: |
          node -e '
          const fs = require("fs");
          const rooms = JSON.parse(fs.readFileSync("rooms.json","utf8"));
          const biliRooms = rooms.filter(r => r.platform === "bilibili");

          async function main() {
            const results = [];
            for (const r of biliRooms) {
              const key = r.platform + ":" + r.id;
              try {
                const res = await fetch("https://api.live.bilibili.com/room/v1/Room/get_info?room_id=" + r.id);
                const d = await res.json();
                if (d.code === 0 && d.data) {
                  const info = d.data;
                  const statusMap = {0:"offline",1:"live",2:"replay"};
                  let uname="", avatar="";
                  try {
                    const ures = await fetch("https://api.live.bilibili.com/live_user/v1/UserInfo/get_anchor_in_room?room_id=" + r.id);
                    const ud = await ures.json();
                    if (ud.code === 0 && ud.data) {
                      const ui = ud.data.info || ud.data;
                      uname = ui.uname || ""; avatar = ui.avatar || ui.face || "";
                    }
                  } catch(e) {}
                  results.push({
                    key, platform: r.platform, id: r.id, name: r.name,
                    title: info.title || "", liveStatus: statusMap[info.live_status] || "offline",
                    viewerCount: info.online || 0, cover: info.user_cover || info.keyframe || "",
                    uname, avatar, fetchedAt: new Date().toISOString()
                  });
                } else {
                  results.push({key, platform: r.platform, id: r.id, name: r.name, error: d.message || "API error", fetchedAt: new Date().toISOString()});
                }
              } catch(e) {
                results.push({key, platform: r.platform, id: r.id, name: r.name, error: e.message, fetchedAt: new Date().toISOString()});
              }
            }
            // 先保存 B站的结果，后续步骤再追加快手
            fs.writeFileSync("bilibili_results.json", JSON.stringify(results, null, 2));
            console.log("Bilibili: " + results.length + " rooms");
            results.forEach(r => console.log("  " + (r.name||r.id) + " → " + (r.liveStatus || r.error)));
          }
          main();
          '

      # ---- 快手：Python + requests 尝试 ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Kuaishou status
        run: |
          pip install requests -q
          python3 << 'PYEOF'
          import json, requests, re

          results = []
          with open("rooms.json") as f:
              rooms = json.load(f)

          for r in rooms:
              if r["platform"] != "kuaishou":
                  continue
              key = f"{r['platform']}:{r['id']}"
              entry = {"key": key, "platform": "kuaishou", "id": r["id"], "name": r.get("name","")}
              try:
                  # Kuaishou 直播间URL
                  url = f"https://live.kuaishou.com/u/{r['id']}"
                  headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
                  resp = requests.get(url, headers=headers, timeout=15)
                  html = resp.text

                  # 尝试提取 __INITIAL_STATE__
                  # 注意：JSON中可能包含转义的引号和嵌套的大括号
                  match = re.search(r'window\.__INITIAL_STATE__\s*=\s*({.*?});\s*</script>', html, re.DOTALL)
                  if match:
                      raw = match.group(1)
                      # 尝试解析
                      try:
                          state = json.loads(raw)
                      except:
                          # 如果直接解析失败，尝试修复常见问题
                          raw = raw.replace("\\'", "'")
                          # 使用 more json 容错解析
                          state = json.loads(raw)

                      # 从 state 中提取直播信息
                      if "liveroom" in state:
                          lr = state["liveroom"]
                          is_live = lr.get("liveStatus") == 1 or lr.get("isLive") == True or lr.get("status") == 1
                          entry["title"] = lr.get("title","") or lr.get("roomName","") or lr.get("introduction","") or ""
                          entry["liveStatus"] = "live" if is_live else "offline"
                          entry["viewerCount"] = lr.get("viewerCount",0) or lr.get("onlineCount",0) or lr.get("totalCount",0)
                          entry["cover"] = lr.get("cover","") or lr.get("screenshot","") or lr.get("shareUrl","") or ""
                          entry["uname"] = lr.get("nickname","") or lr.get("nick","") or lr.get("userName","") or ""
                          entry["avatar"] = lr.get("avatar","") or lr.get("userAvatar","") or ""
                      else:
                          # 尝试从 user 信息判断
                          entry["liveStatus"] = "offline"
                          entry["title"] = ""
                  else:
                      # 检查页面是否包含直播中的特征
                      is_live_text = "直播" in html and "正在直播" in html
                      entry["liveStatus"] = "live" if is_live_text else "offline"
                      entry["title"] = ""

                  entry["fetchedAt"] = __import__('datetime').datetime.now().isoformat()
              except Exception as e:
                  entry["error"] = str(e)
                  entry["fetchedAt"] = __import__('datetime').datetime.now().isoformat()

              results.append(entry)
              print(f"  Kuaishou/{r.get('name',r['id'])} → {entry.get('liveStatus', entry.get('error','?'))}")

          # 合并 B站结果
          all_results = []
          try:
              with open("bilibili_results.json") as f:
                  all_results = json.load(f)
          except: pass
          all_results += results

          output = {"rooms": all_results, "updatedAt": __import__('datetime').datetime.now().isoformat()}
          with open("status.json", "w") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(f"Total: {len(all_results)} rooms")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name 'live-bot'
          git config user.email 'live-bot@users.noreply.github.com'
          git add status.json
          git diff --staged --quiet || git commit -m 'auto: update live status'
          git push