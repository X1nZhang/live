name: Fetch Live Status
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rooms.json']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- B站：Node.js 直连（已验证稳定） ----
      - name: Fetch Bilibili status
        run: |
          node -e '
          const fs = require("fs");
          const rooms = JSON.parse(fs.readFileSync("rooms.json","utf8"));
          const biliRooms = rooms.filter(r => r.platform === "bilibili");

          async function main() {
            const results = [];
            for (const r of biliRooms) {
              const key = r.platform + ":" + r.id;
              try {
                const res = await fetch("https://api.live.bilibili.com/room/v1/Room/get_info?room_id=" + r.id);
                const d = await res.json();
                if (d.code === 0 && d.data) {
                  const info = d.data;
                  const statusMap = {0:"offline",1:"live",2:"replay"};
                  let uname="", avatar="";
                  try {
                    const ures = await fetch("https://api.live.bilibili.com/live_user/v1/UserInfo/get_anchor_in_room?room_id=" + r.id);
                    const ud = await ures.json();
                    if (ud.code === 0 && ud.data) {
                      const ui = ud.data.info || ud.data;
                      uname = ui.uname || ""; avatar = ui.avatar || ui.face || "";
                    }
                  } catch(e) {}
                  results.push({
                    key, platform: r.platform, id: r.id, name: r.name,
                    title: info.title || "", liveStatus: statusMap[info.live_status] || "offline",
                    viewerCount: info.online || 0, cover: info.user_cover || info.keyframe || "",
                    uname, avatar, fetchedAt: new Date().toISOString()
                  });
                } else {
                  results.push({key, platform: r.platform, id: r.id, name: r.name, error: d.message || "API error", fetchedAt: new Date().toISOString()});
                }
              } catch(e) {
                results.push({key, platform: r.platform, id: r.id, name: r.name, error: e.message, fetchedAt: new Date().toISOString()});
              }
            }
            // 先保存 B站的结果，后续步骤再追加快手
            fs.writeFileSync("bilibili_results.json", JSON.stringify(results, null, 2));
            console.log("Bilibili: " + results.length + " rooms");
            results.forEach(r => console.log("  " + (r.name||r.id) + " → " + (r.liveStatus || r.error)));
          }
          main();
          '

      # ---- 快手：Python + requests 尝试 ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests streamget httpx[http2] pycryptodome -q

      - name: Fetch Kuaishou + Douyin status
        run: |
          python3 << 'PYEOF'
          import json, requests, re, sys

          results = []
          with open("rooms.json") as f:
              rooms = json.load(f)

          def fetch_kuaishou(r):
              key = f"{r['platform']}:{r['id']}"
              entry = {"key": key, "platform": "kuaishou", "id": r["id"], "name": r.get("name","")}
              try:
                  url = f"https://live.kuaishou.com/u/{r['id']}"
                  headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
                  resp = requests.get(url, headers=headers, timeout=15)
                  html = resp.text
                  match = re.search(r'window\.__INITIAL_STATE__\s*=\s*({.*?});\s*</script>', html, re.DOTALL)
                  if match:
                      raw = match.group(1)
                      try: state = json.loads(raw)
                      except:
                          raw = raw.replace("\\'", "'")
                          state = json.loads(raw)
                      if "liveroom" in state:
                          lr = state["liveroom"]
                          is_live = lr.get("liveStatus") == 1 or lr.get("isLive") == True or lr.get("status") == 1
                          entry["title"] = lr.get("title","") or lr.get("roomName","") or ""
                          entry["liveStatus"] = "live" if is_live else "offline"
                          entry["viewerCount"] = lr.get("viewerCount",0) or lr.get("onlineCount",0) or 0
                          entry["cover"] = lr.get("cover","") or lr.get("screenshot","") or ""
                          entry["uname"] = lr.get("nickname","") or lr.get("nick","") or ""
                          entry["avatar"] = lr.get("avatar","") or lr.get("userAvatar","") or ""
                      else:
                          entry["liveStatus"] = "offline"
                  else:
                      entry["liveStatus"] = "offline"
                  entry["fetchedAt"] = __import__('datetime').datetime.now().isoformat()
              except Exception as e:
                  entry["error"] = str(e)
                  entry["fetchedAt"] = __import__('datetime').datetime.now().isoformat()
              print(f"  Kuaishou/{r.get('name',r['id'])} → {entry.get('liveStatus', entry.get('error','?'))}")
              return entry

          def fetch_douyin(r):
              key = f"{r['platform']}:{r['id']}"
              entry = {"key": key, "platform": "douyin", "id": r["id"], "name": r.get("name","")}
              try:
                  # 用 streamget 尝试获取抖音直播信息
                  from streamget import DouyinLiveStream
                  import asyncio

                  async def get_info():
                      dy = DouyinLiveStream()
                      # 抖音直播间 URL
                      url = f"https://live.douyin.com/{r['id']}"
                      data = await dy.fetch_web_stream_data(url=url)
                      if not data:
                          # 如果 live.douyin.com 不行，试试 www.douyin.com
                          url = f"https://www.douyin.com/user/{r['id']}"
                          data = await dy.fetch_web_stream_data(url=url)
                      return data

                  info = asyncio.run(get_info())
                  # streamget 返回的数据结构因平台而异
                  # 尝试提取关键信息
                  if info and isinstance(info, dict):
                      # 直播状态
                      status = info.get("status") or info.get("live_status") or info.get("isLive") or info.get("room_id")
                      is_live = status is not None and status != 0 and status != "0" and status != "offline"

                      entry["title"] = info.get("title","") or info.get("room_title","") or ""
                      entry["liveStatus"] = "live" if is_live else "offline"
                      entry["viewerCount"] = info.get("viewer_count",0) or info.get("online_count",0) or info.get("total_count",0) or 0
                      entry["cover"] = info.get("cover","") or info.get("cover_url","") or ""
                      entry["uname"] = info.get("anchor_name","") or info.get("nickname","") or ""
                      entry["avatar"] = info.get("avatar","") or info.get("anchor_avatar","") or ""
                  else:
                      entry["liveStatus"] = "offline"
                  entry["fetchedAt"] = __import__('datetime').datetime.now().isoformat()
              except ImportError as e:
                  entry["error"] = f"streamget 未安装: {e}"
                  entry["fetchedAt"] = __import__('datetime').datetime.now().isoformat()
              except Exception as e:
                  entry["error"] = f"抖音: {e}"
                  entry["fetchedAt"] = __import__('datetime').datetime.now().isoformat()
              print(f"  Douyin/{r.get('name',r['id'])} → {entry.get('liveStatus', entry.get('error','?'))}")
              return entry

          for r in rooms:
              if r["platform"] == "kuaishou":
                  results.append(fetch_kuaishou(r))
              elif r["platform"] == "douyin":
                  results.append(fetch_douyin(r))

          # 合并 B站结果
          all_results = []
          try:
              with open("bilibili_results.json") as f:
                  all_results = json.load(f)
          except: pass
          all_results += results

          output = {"rooms": all_results, "updatedAt": __import__('datetime').datetime.now().isoformat()}
          with open("status.json", "w") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(f"Total: {len(all_results)} rooms")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name 'live-bot'
          git config user.email 'live-bot@users.noreply.github.com'
          git add status.json
          git diff --staged --quiet || git commit -m 'auto: update live status'
          git push