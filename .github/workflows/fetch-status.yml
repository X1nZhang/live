name: Fetch Live Status
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rooms.json']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install streamget
        run: pip install streamget httpx[http2] pycryptodome -q

      - name: Fetch all rooms via streamget
        run: |
          python3 << 'PYEOF'
          import json, asyncio
          from datetime import datetime, timezone

          async def fetch(module_name, class_name, url):
              """通过 streamget 解析直播间状态"""
              try:
                  mod = __import__('streamget', fromlist=[class_name])
                  cls = getattr(mod, class_name)
                  stream = cls()
                  data = await stream.fetch_web_stream_data(url=url)
                  if not data or not isinstance(data, dict):
                      return {"liveStatus": "offline"}
                  # 提取开播状态
                  status_keys = ['status','live_status','isLive','liveStatus','room_id']
                  raw = None
                  for k in status_keys:
                      v = data.get(k)
                      if v is not None: raw = v; break
                  if raw is None:
                      is_live = False
                  elif isinstance(raw, bool):
                      is_live = raw
                  elif isinstance(raw, int):
                      is_live = raw == 1
                  elif isinstance(raw, str):
                      is_live = raw.lower() in ('1','live','on','true')
                  else:
                      is_live = bool(raw)
                  return {
                      "liveStatus": "live" if is_live else "offline",
                      "title": data.get("title","") or data.get("room_title","") or data.get("introduction","") or data.get("roomName","") or "",
                      "viewerCount": data.get("viewer_count",0) or data.get("online",0) or data.get("online_count",0) or data.get("total_count",0) or data.get("viewerCount",0) or 0,
                      "cover": data.get("cover","") or data.get("cover_url","") or data.get("user_cover","") or data.get("screenshot","") or "",
                      "uname": data.get("anchor_name","") or data.get("nickname","") or data.get("nick","") or data.get("uname","") or "",
                      "avatar": data.get("avatar","") or data.get("anchor_avatar","") or data.get("userAvatar","") or data.get("face","") or "",
                  }
              except Exception as e:
                  # streamget 报错（比如账号被封、没在播）也视为 offline
                  return {"liveStatus": "offline"}

          async def main():
              with open("rooms.json") as f:
                  rooms = json.load(f)
              results = []
              for r in rooms:
                  plat = r["platform"]
                  key = f"{plat}:{r['id']}"
                  entry = {"key": key, "platform": plat, "id": r["id"], "name": r.get("name","")}
                  if plat == "bilibili":
                      info = await fetch('streamget', 'BilibiliLiveStream', f'https://live.bilibili.com/{r["id"]}')
                  elif plat == "kuaishou":
                      info = await fetch('streamget', 'KwaiLiveStream', f'https://live.kuaishou.com/u/{r["id"]}')
                  elif plat == "douyin":
                      info = await fetch('streamget', 'DouyinLiveStream', f'https://live.douyin.com/{r["id"]}')
                  else:
                      entry["error"] = f"不支持的平台: {plat}"
                      results.append(entry)
                      continue
                  entry.update(info)
                  entry["fetchedAt"] = datetime.now(timezone.utc).isoformat()
                  results.append(entry)
                  print(f"  {plat}/{r.get('name',r['id'])} → {entry.get('liveStatus', entry.get('error','?'))}")

              output = {"rooms": results, "updatedAt": datetime.now(timezone.utc).isoformat()}
              with open("status.json", "w") as f:
                  json.dump(output, f, ensure_ascii=False, indent=2)
              print(f"Total: {len(results)} rooms")

          asyncio.run(main())
          PYEOF

      - name: Commit and push
        run: |
          git config user.name 'live-bot'
          git config user.email 'live-bot@users.noreply.github.com'
          git add status.json
          git diff --staged --quiet || git commit -m 'auto: update live status'
          git push