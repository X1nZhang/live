<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播间开播监控</title>
<style>
  :root {
    --bg: #0f0f11;
    --card-bg: #1a1a1e;
    --card-border: #2a2a30;
    --text: #e8e8ea;
    --text-secondary: #88889a;
    --live-color: #00d45a;
    --offline-color: #555;
    --accent: #fb7299;
    --bili-blue: #00a1d6;
    --warn: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
  }

  /* ============ 顶部 ============ */
  .header {
    max-width: 1200px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #fb7299, #00a1d6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .status-summary { font-size: 14px; color: var(--text-secondary); }
  .status-summary .count-live { color: var(--live-color); font-weight: 600; }
  .btn {
    padding: 8px 20px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { opacity: .8; color: #fff; }
  .last-update { font-size: 13px; color: var(--text-secondary); }

  /* ============ 通知 ============ */
  .notice {
    max-width: 1200px;
    margin: 0 auto 24px;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .notice.warn { display: block; background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: var(--warn); }

  /* ============ 房间网格 ============ */
  .rooms-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .room-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s, transform .15s;
    position: relative;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .room-card:hover { border-color: #444; transform: translateY(-2px); }
  .room-card:active { transform: translateY(0); }
  .room-card.live { border-color: var(--live-color); box-shadow: 0 0 20px rgba(0, 212, 90, .08); }
  .cover-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #121214;
    overflow: hidden;
  }
  .cover-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .cover-wrap .placeholder {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    font-size: 48px;
  }
  .live-badge {
    position: absolute;
    top: 10px; left: 10px;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .live-badge.live { background: rgba(0, 212, 90, .9); color: #fff; }
  .live-badge.live::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .live-badge.offline { background: rgba(85, 85, 85, .85); color: #aaa; }
  .live-badge.replay { background: rgba(251, 114, 153, .85); color: #fff; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .viewer-count {
    position: absolute;
    bottom: 10px; right: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(0,0,0,.7);
    color: #fff;
    font-size: 12px;
  }
  .room-info { padding: 14px 16px; }
  .room-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .room-title.offline-title { color: var(--text-secondary); }
  .room-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .room-owner { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .room-owner .avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #2a2a30;
    flex-shrink: 0;
    overflow: hidden;
  }
  .room-owner .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .room-owner span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .platform-tag {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .platform-tag.bilibili { background: rgba(0,161,214,.15); color: var(--bili-blue); }
  .platform-tag.douyu { background: rgba(251,114,153,.15); color: var(--accent); }
  .platform-tag.huya { background: rgba(255,153,0,.15); color: #f90; }
  .platform-tag.kuaishou { background: rgba(255,0,0,.15); color: #ff4d4f; }
  .platform-tag.other { background: rgba(136,136,154,.15); color: var(--text-secondary); }
  .room-error { font-size: 12px; color: #ef4444; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ============ 登录 ============ */
  .login-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .login-overlay.show { display: flex; }
  .login-box {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 40px 36px;
    width: 360px;
    max-width: 90vw;
  }
  .login-box h2 {
    text-align: center;
    margin-bottom: 28px;
    font-size: 20px;
    background: linear-gradient(135deg, #fb7299, #00a1d6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .login-box label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .login-box input {
    width: 100%;
    padding: 10px 14px;
    background: #0a0a0c;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color .2s;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box .btn { width: 100%; justify-content: center; padding: 10px; font-size: 15px; }
  .login-error {
    color: #ef4444;
    font-size: 13px;
    text-align: center;
    margin-bottom: 12px;
    display: none;
  }

  /* ============ 管理面板 ============ */
  .admin-panel {
    display: none;
    max-width: 1200px;
    margin: 0 auto 24px;
    padding: 20px 24px;
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 12px;
  }
  .admin-panel.show { display: block; }
  .admin-panel h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--accent);
  }
  .admin-panel label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .admin-panel textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    background: #0a0a0c;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: "Cascadia Code", "Fira Code", monospace;
    resize: vertical;
    line-height: 1.6;
  }
  .admin-panel textarea:focus { outline: none; border-color: var(--accent); }
  .admin-hint {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .admin-actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .admin-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--card-border);
  }
  .admin-user {
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* ============ 响应式 ============ */
  @media (max-width: 640px) {
    body { padding: 16px 12px; }
    .rooms-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- ============== 头部 ============== -->
<div class="header">
  <h1>📡 直播间监控</h1>
  <div class="header-controls">
    <span class="status-summary" id="statusSummary">加载中...</span>
    <span class="last-update" id="lastUpdate"></span>
    <button class="btn" id="refreshBtn" onclick="refreshAll(true)">🔄 刷新</button>
    <a class="btn" id="adminLink" href="#admin">🔒 管理</a>
  </div>
</div>

<div id="notice" class="notice"></div>

<!-- ============== 登录弹窗 ============== -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>管理员登录</h2>
    <div class="login-error" id="loginError">用户名或密码错误</div>
    <label for="loginUser">用户名</label>
    <input type="text" id="loginUser" placeholder="请输入用户名" autocomplete="username">
    <label for="loginPass">密码</label>
    <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="current-password">
    <button class="btn btn-primary" onclick="handleLogin()">登 录</button>
    <div style="text-align:center;margin-top:12px">
      <a href="#public" style="color:var(--text-secondary);font-size:13px;text-decoration:none">返回监控</a>
    </div>
  </div>
</div>

<!-- ============== 管理面板 ============== -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-bar">
    <h3>⚙️ 监控配置管理</h3>
    <div>
      <span class="admin-user" id="adminUserInfo"></span>
      <button class="btn" onclick="handleLogout()" style="margin-left:8px">退出登录</button>
      <a class="btn" href="#public">返回监控</a>
    </div>
  </div>
  <label for="adminConfig">房间列表（每行一个：平台 房间号 备注名）</label>
  <textarea id="adminConfig" spellcheck="false"></textarea>
  <div class="admin-hint">支持平台：<code>bilibili</code>（B站）、<code>douyu</code>（斗鱼）、<code>huya</code>（虎牙）</div>

  <div style="margin-top:12px">
    <label for="adminProxy">CORS 代理地址</label>
    <input type="text" id="adminProxy" style="width:100%;padding:8px 12px;background:#0a0a0c;border:1px solid var(--card-border);border-radius:6px;color:var(--text);font-size:13px;font-family:monospace">
  </div>

  <div class="admin-hint" style="margin-top:4px">留空使用默认公共代理。从 HTTP 服务器访问时可不填（直连 B站 API）。</div>

  <div class="admin-actions">
    <button class="btn btn-primary" onclick="adminSave()">💾 保存配置</button>
    <button class="btn" onclick="adminReset()">↩️ 恢复默认</button>
  </div>
</div>

<!-- ============== 房间网格 ============== -->
<div class="rooms-grid" id="roomsGrid">
  <div class="error-msg">正在加载房间列表...</div>
</div>

<script>
// ===================== 管理员账号 =====================
// ⚠️ 请修改密码！注意密码明文显示在源码中（纯静态页面无后端）
const ADMIN_CREDENTIALS = {
  username: 'zx',
  password: '123',
};

// ===================== 默认配置 =====================
const DEFAULT_ROOMS = [
  { platform: 'bilibili', id: '1742439556', name: '激素猪' },
  { platform: 'bilibili', id: '10274888',   name: 'BlackDog' },
];
const DEFAULT_PROXY = 'https://api.allorigins.win/raw?url=';
const REFRESH_INTERVAL = 40000;

// ===================== 状态 =====================
let rooms = [];
let proxyUrl = DEFAULT_PROXY;
let timer = null;

// ===================== 存储 =====================
function loadRooms() {
  try {
    const saved = localStorage.getItem('live_monitor_rooms');
    return saved ? JSON.parse(saved) : null;
  } catch(e) { return null; }
}
function saveRooms(r) {
  localStorage.setItem('live_monitor_rooms', JSON.stringify(r));
}
function loadProxy() {
  try {
    return localStorage.getItem('live_monitor_proxy') || DEFAULT_PROXY;
  } catch(e) { return DEFAULT_PROXY; }
}
function saveProxy(p) {
  localStorage.setItem('live_monitor_proxy', p);
}

// ===================== 带 CORS 代理的 fetch =====================
// 判断是否需要代理（HTTPS/GitHub Pages 下直连 B站 API 会跨域失败）
const needsProxy = window.location.protocol === 'https:' ||
                    window.location.hostname.endsWith('.github.io');

async function fetchViaProxy(url) {
  // 需要代理时直接走代理，跳过直连（省一次失败等待）
  if (needsProxy && proxyUrl) {
    const resp = await fetch(proxyUrl + encodeURIComponent(url));
    if (!resp.ok) throw new Error(`代理返回 HTTP ${resp.status}`);
    return JSON.parse(await resp.text());
  }
  // 本地环境先试直连
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

// ===================== API 封装 =====================
const API = {
  async bilibili(roomId) {
    const infoUrl = `https://api.live.bilibili.com/room/v1/Room/get_info?room_id=${roomId}`;
    const userUrl = `https://api.live.bilibili.com/live_user/v1/UserInfo/get_anchor_in_room?room_id=${roomId}`;
    // 房间信息和用户信息并行获取
    const [infoData, userData] = await Promise.allSettled([
      fetchViaProxy(infoUrl),
      fetchViaProxy(userUrl)
    ]);

    if (infoData.status !== 'fulfilled') throw new Error('B站 API 错误: ' + (infoData.reason?.message || ''));
    const info = infoData.value;
    if (info.code !== 0) throw new Error(info.message || 'B站 API 错误');
    const data = info.data;
    let avatar = '', uname = '';
    if (userData.status === 'fulfilled' && userData.value?.code === 0 && userData.value?.data) {
      const ui = userData.value.data.info || userData.value.data;
      uname = ui.uname || uname;
      avatar = ui.avatar || ui.face || '';
    }
    const statusMap = { 0: 'offline', 1: 'live', 2: 'replay' };
    return {
      title: data.title || '未开播',
      liveStatus: statusMap[info.live_status] || 'offline',
      viewerCount: data.online || 0,
      cover: data.user_cover || data.keyframe || '',
      uname, avatar,
      roomId: String(data.room_id || roomId),
    };
  },
  async douyu(roomId) {
    const data = await fetchViaProxy(`https://open.douyucdn.cn/api/RoomApi/room/${roomId}`);
    if (data.error !== 0) throw new Error(data.data || '斗鱼 API 错误');
    const d = data.data;
    return {
      title: d.room_name || '未开播',
      liveStatus: d.room_status === '1' ? 'live' : 'offline',
      viewerCount: parseInt(d.online) || 0,
      cover: d.room_src || d.room_pic || '',
      uname: d.nickname || '',
      avatar: d.avatar?.small || d.owner_avatar || '',
      roomId: String(roomId),
    };
  },
  async huya(roomId) {
    if (!proxyUrl) throw new Error('虎牙必须通过 CORS 代理');
    const resp = await fetch(proxyUrl + encodeURIComponent('https://m.huya.com/' + roomId));
    const html = await resp.text();
    let liveStatus = 'offline', title = '未开播', uname = '', avatar = '', viewerCount = 0, cover = '';
    const m = html.match(/<script>window\.__INITIAL_STATE__\s*=\s*({[\s\S]*?})<\/script>/);
    if (m) try {
      const state = JSON.parse(m[1]);
      const ri = state.roomInfo || state;
      const pf = ri.profileInfo || ri.roomInfo || ri;
      uname = pf.nick || pf.name || uname;
      avatar = pf.avatar || avatar;
      const li = ri.liveInfo || ri.roomInfo || ri;
      title = li.introduction || li.roomName || li.title || title;
      liveStatus = li.liveStatus === 'ON' || li.liveStatus === 1 || li.isLive === true ? 'live' : 'offline';
      viewerCount = parseInt(li.totalCount) || parseInt(li.activityCount) || 0;
      cover = (li.screenshot || li.roomImg || '').replace(/^\/\//, 'https://');
    } catch(_) {}
    if (!uname) { const n = html.match(/<span class="host-name"[^>]*>([^<]+)</); if (n) uname = n[1]; }
    return { title, liveStatus, viewerCount, cover, uname, avatar, roomId: String(roomId) };
  },
};

// ===================== 房间跳转链接 =====================
function getRoomUrl(platform, id) {
  const urls = {
    bilibili: 'https://live.bilibili.com/',
    douyu: 'https://www.douyu.com/',
    huya: 'https://www.huya.com/',
    kuaishou: 'https://live.kuaishou.com/u/',
  };
  return (urls[platform] || 'https://live.bilibili.com/') + id;
}

// ===================== 渲染 =====================
function formatViewers(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}
function statusText(s) { return { live: '直播中', offline: '未开播', replay: '轮播中' }[s] || s; }

function renderRoom(room, data, error) {
  const url = getRoomUrl(room.platform, room.id);
  const card = document.createElement('a');
  card.href = url;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.className = 'room-card' + (data?.liveStatus === 'live' ? ' live' : '');
  const bc = data?.liveStatus === 'live' ? 'live' : data?.liveStatus === 'replay' ? 'replay' : 'offline';
  const sv = data?.liveStatus === 'live' || data?.liveStatus === 'replay';
  card.innerHTML = `
    <div class="cover-wrap">
      ${data?.cover ? `<img src="${data.cover}" alt="" loading="lazy" onerror="this.parentElement.querySelector('.placeholder').style.display='flex';this.style.display='none'">` : ''}
      <div class="placeholder" style="display:${data?.cover ? 'none' : 'flex'}">📺</div>
      <div class="live-badge ${bc}">${statusText(data?.liveStatus || '等待中')}</div>
      ${sv ? `<span class="viewer-count">👁 ${formatViewers(data.viewerCount)}</span>` : ''}
    </div>
    <div class="room-info">
      <div class="room-title ${data?.liveStatus !== 'live' ? 'offline-title' : ''}">${data?.title || (error ? '出错了' : '加载中...')}</div>
      <div class="room-meta">
        <div class="room-owner"><div class="avatar">${data?.avatar ? `<img src="${data.avatar}" onerror="this.style.display='none'">` : ''}</div><span>${data?.uname || room.name || room.id}</span></div>
        <span class="platform-tag ${room.platform}">${room.platform}</span>
      </div>
      ${error ? `<div class="room-error">❌ ${error}</div>` : ''}
    </div>`;
  return card;
}

function render(roomDataMap, errors) {
  const grid = document.getElementById('roomsGrid');
  grid.innerHTML = '';
  let liveCount = 0;
  rooms.forEach(room => {
    const key = room.platform + ':' + room.id;
    const data = roomDataMap[key];
    if (data?.liveStatus === 'live') liveCount++;
    grid.appendChild(renderRoom(room, data, errors[key]));
  });
  document.getElementById('statusSummary').innerHTML =
    `<span class="count-live">${liveCount}</span> 直播中 / ${rooms.length} 房间`;
}

// ===================== 数据获取 =====================
const STATUS_JSON_URL = '/live/status.json';

async function refreshAll(isManualRefresh) {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⏳ 刷新中...';
  const roomDataMap = {}, errors = {};
  let useProxy = isManualRefresh;  // 手动刷新走代理实时拉取

  if (!useProxy) {
    // 首次/定时刷新：先尝试读取 status.json（速度快，无 CORS 问题）
    try {
      const resp = await fetch(STATUS_JSON_URL + '?t=' + Date.now());
      if (resp.ok) {
        const data = await resp.json();
        if (data.rooms && data.rooms.length > 0) {
          data.rooms.forEach(r => {
            if (r.error) errors[r.key] = r.error;
            else roomDataMap[r.key] = r;
          });
          render(roomDataMap, errors);
          document.getElementById('lastUpdate').textContent =
            '更新于 ' + new Date(data.updatedAt).toLocaleTimeString('zh-CN') + ' (缓存)';
          btn.disabled = false; btn.textContent = '🔄 刷新';
          return;
        }
      }
    } catch (_) {}
    useProxy = true;  // status.json 失败了，走代理
  }

  // 手动刷新 或 status.json 不可用时：通过代理实时拉取
  const results = await Promise.allSettled(rooms.map(async (room) => {
    const key = room.platform + ':' + room.id;
    const fetcher = API[room.platform];
    if (!fetcher) throw new Error(`不支持的平台: ${room.platform}`);
    const data = await fetcher(room.id);
    return { key, data };
  }));

  results.forEach((res, i) => {
    if (res.status === 'fulfilled') {
      roomDataMap[res.value.key] = res.value.data;
    } else {
      const key = rooms[i].platform + ':' + rooms[i].id;
      errors[key] = res.reason?.message || String(res.reason);
    }
  });
  render(roomDataMap, errors);
  document.getElementById('lastUpdate').textContent = '上次更新: ' + new Date().toLocaleTimeString('zh-CN');
  btn.disabled = false; btn.textContent = '🔄 刷新';
}

// ===================== 启动监控 =====================
function startMonitoring() {
  if (timer) clearInterval(timer);
  refreshAll();
  timer = setInterval(refreshAll, REFRESH_INTERVAL);
}

function initRooms() {
  const saved = loadRooms();
  rooms = saved || [...DEFAULT_ROOMS];
  proxyUrl = loadProxy();
  startMonitoring();
}

// ===================== 认证 =====================
function isAdmin() {
  return sessionStorage.getItem('live_monitor_admin') === 'true';
}

function handleLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');

  if (!user || !pass) { errEl.textContent = '请输入用户名和密码'; errEl.style.display = 'block'; return; }

  if (user !== ADMIN_CREDENTIALS.username || pass !== ADMIN_CREDENTIALS.password) {
    errEl.textContent = '用户名或密码错误'; errEl.style.display = 'block'; return;
  }

  // 登录成功
  sessionStorage.setItem('live_monitor_admin', 'true');
  errEl.style.display = 'none';
  document.getElementById('loginOverlay').classList.remove('show');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  showAdminPanel();
}

function handleLogout() {
  sessionStorage.removeItem('live_monitor_admin');
  hideAdminPanel();
  location.hash = 'public';
}

// ============== 管理面板 ==============
function showAdminPanel() {
  const panel = document.getElementById('adminPanel');
  panel.classList.add('show');
  document.getElementById('adminUserInfo').textContent = '已登录：' + ADMIN_CREDENTIALS.username;
  document.getElementById('adminConfig').value = rooms.map(r =>
    `${r.platform} ${r.id} ${r.name || ''}`.trim()
  ).join('\n');
  document.getElementById('adminProxy').value = proxyUrl;
  document.getElementById('adminLink').textContent = '⚙️ 配置';
  document.getElementById('adminLink').href = '#admin';
}

function hideAdminPanel() {
  document.getElementById('adminPanel').classList.remove('show');
  document.getElementById('adminLink').textContent = '🔒 管理';
}

function adminSave() {
  const text = document.getElementById('adminConfig').value;
  const parsed = text.split('\n')
    .map(l => l.trim()).filter(l => l && !l.startsWith('#'))
    .map(l => { const p = l.split(/\s+/); return p.length >= 2 ? { platform: p[0].toLowerCase(), id: p[1], name: p.slice(2).join(' ') || '' } : null; })
    .filter(Boolean);
  if (parsed.length === 0) { alert('没有解析到有效房间'); return; }

  rooms = parsed;
  saveRooms(parsed);

  const p = document.getElementById('adminProxy').value.trim();
  if (p) { proxyUrl = p; saveProxy(p); }

  startMonitoring();
  alert('✅ 配置已保存');
}

function adminReset() {
  rooms = [...DEFAULT_ROOMS];
  proxyUrl = DEFAULT_PROXY;
  saveRooms(DEFAULT_ROOMS);
  saveProxy(DEFAULT_PROXY);
  document.getElementById('adminConfig').value = rooms.map(r =>
    `${r.platform} ${r.id} ${r.name || ''}`.trim()
  ).join('\n');
  document.getElementById('adminProxy').value = DEFAULT_PROXY;
  startMonitoring();
  alert('✅ 已恢复默认配置');
}

// ===================== 路由 =====================
function handleHashChange() {
  const hash = location.hash.slice(1) || 'public';

  if (hash === 'admin') {
    if (isAdmin()) {
      document.getElementById('loginOverlay').classList.remove('show');
      showAdminPanel();
    } else {
      hideAdminPanel();
      document.getElementById('loginOverlay').classList.add('show');
      document.getElementById('loginUser').focus();
    }
  } else {
    document.getElementById('loginOverlay').classList.remove('show');
    hideAdminPanel();
  }
}

// ===================== 键盘事件 =====================
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginOverlay').classList.contains('show')) {
    handleLogin();
  }
});

// ===================== 初始化 =====================
window.addEventListener('hashchange', handleHashChange);

initRooms();

// 检查是否需要进入管理界面
if (location.hash === '#admin') {
  handleHashChange();
}

// file:// 提示
if (window.location.protocol === 'file:') {
  document.getElementById('notice').className = 'notice warn';
  document.getElementById('notice').innerHTML = '💡 从 file:// 直接打开可能因跨域限制无法获取数据。建议用 <code>python -m http.server 8080</code> 启动临时服务器访问。';
}
</script>
