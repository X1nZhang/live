<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播间开播监控</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card-bg: #141418;
    --card-border: #252530;
    --text: #efeff1;
    --text-secondary: #8a8a9e;
    --live-color: #00d45a;
    --live-glow: rgba(0,212,90,.15);
    --offline-color: #555;
    --accent: #fb7299;
    --bili-blue: #00a1d6;
    --douyin-pink: #ee2c5c;
    --kuaishou-red: #ff4d4f;
    --warn: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse at 20% 20%, rgba(251,114,153,.04) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(0,161,214,.04) 0%, transparent 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 24px;
  }

  /* ============ 顶部 ============ */
  .header {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.3px;
    background: linear-gradient(135deg, #fb7299, #00a1d6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .status-summary {
    font-size: 14px;
    color: var(--text-secondary);
    padding: 6px 14px;
    background: rgba(255,255,255,.04);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.06);
  }
  .status-summary .count-live { color: var(--live-color); font-weight: 700; }
  .status-summary .count-total { color: var(--text-secondary); }
  .btn {
    padding: 7px 18px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all .25s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(251,114,153,.06); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { opacity: .85; color: #fff; background: var(--accent); }
  .btn-spin .btn-icon { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .last-update {
    font-size: 12px;
    color: var(--text-secondary);
    opacity: .7;
  }

  /* ============ 通知 ============ */
  .notice {
    max-width: 1200px;
    margin: 0 auto 24px;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .notice.warn { display: block; background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: var(--warn); }

  /* ============ 房间网格 ============ */
  .rooms-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .room-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .3s ease, box-shadow .4s ease, transform .25s ease;
    position: relative;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    animation: cardEnter .4s ease both;
  }
  .room-card:nth-child(1) { animation-delay: 0s; }
  .room-card:nth-child(2) { animation-delay: .05s; }
  .room-card:nth-child(3) { animation-delay: .1s; }
  .room-card:nth-child(4) { animation-delay: .15s; }
  .room-card:nth-child(5) { animation-delay: .2s; }
  .room-card:nth-child(6) { animation-delay: .25s; }
  .room-card:nth-child(7) { animation-delay: .3s; }
  .room-card:nth-child(8) { animation-delay: .35s; }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .room-card:hover { border-color: #3a3a4a; transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .room-card:active { transform: translateY(-1px); }
  .room-card.live {
    border-color: var(--live-color);
    box-shadow: 0 0 24px var(--live-glow);
    animation: livePulse 3s ease-in-out infinite, cardEnter .4s ease both;
  }
  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 18px var(--live-glow); }
    50% { box-shadow: 0 0 32px var(--live-glow), 0 0 60px rgba(0,212,90,.05); }
  }
  .room-card.live:hover { box-shadow: 0 0 32px var(--live-glow), 0 8px 30px rgba(0,0,0,.3); }
  .cover-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #121214;
    overflow: hidden;
  }
  .cover-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .cover-wrap .placeholder {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    font-size: 48px;
  }
  .live-badge {
    position: absolute;
    top: 10px; left: 10px;
    padding: 4px 12px 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: .3px;
    text-transform: uppercase;
    backdrop-filter: blur(4px);
  }
  .live-badge.live { background: rgba(0, 212, 90, .92); color: #fff; }
  .live-badge.live::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #fff;
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
  .live-badge.offline { background: rgba(85, 85, 85, .8); color: #999; }
  .live-badge.replay { background: rgba(251, 114, 153, .88); color: #fff; }
  .viewer-count {
    position: absolute;
    bottom: 10px; right: 10px;
    padding: 3px 10px;
    border-radius: 6px;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
  }
  .room-info { padding: 14px 16px; }
  .room-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .room-title.live-title { color: var(--text); }
  .room-title.offline-title { color: var(--text-secondary); }
  .room-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .room-owner { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .room-owner .avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #2a2a30;
    flex-shrink: 0;
    overflow: hidden;
  }
  .room-owner .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .room-owner span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .platform-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .platform-dot.bilibili { background: var(--bili-blue); }
  .platform-dot.douyin { background: #fff; border: 1px solid rgba(255,255,255,.3); }
  .platform-dot.kuaishou { background: var(--kuaishou-red); }
  .platform-dot.douyu { background: var(--accent); }
  .platform-dot.huya { background: #f90; }
  .platform-dot.other { background: var(--text-secondary); }
  .platform-tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .platform-tag.bilibili { background: var(--bili-blue); color: #fff; }
  .platform-tag.douyin { background: #1a1a2e; color: #fff; border: 1px solid rgba(255,255,255,.1); }
  .platform-tag.kuaishou { background: var(--kuaishou-red); color: #fff; }
  .platform-tag.douyu { background: var(--accent); color: #fff; }
  .platform-tag.huya { background: #f90; color: #fff; }
  .platform-tag.other { background: #555; color: #ccc; }
  .room-error { font-size: 11px; color: #ef4444; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }

  /* ============ 登录 ============ */
  .login-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .login-overlay.show { display: flex; }
  .login-box {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 36px 32px;
    width: 340px;
    max-width: 90vw;
    box-shadow: 0 24px 80px rgba(0,0,0,.5);
  }
  .login-box h2 {
    text-align: center;
    margin-bottom: 24px;
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, #fb7299, #00a1d6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .login-box label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .login-box input {
    width: 100%;
    padding: 10px 14px;
    background: #0a0a0c;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .login-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(251,114,153,.1); }
  .login-box .btn { width: 100%; justify-content: center; padding: 10px; font-size: 14px; border-radius: 10px; }
  .login-error {
    color: #ef4444;
    font-size: 13px;
    text-align: center;
    margin-bottom: 12px;
    display: none;
  }

  /* ============ 管理面板 ============ */
  .admin-panel {
    display: none;
    max-width: 1200px;
    margin: 0 auto 24px;
    padding: 24px 28px;
    background: var(--card-bg);
    border: 1px solid rgba(251,114,153,.25);
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(251,114,153,.04);
  }
  .admin-panel.show { display: block; animation: cardEnter .3s ease both; }
  .admin-panel h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -.2px;
  }
  .admin-panel label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .admin-panel textarea {
    width: 100%;
    min-height: 100px;
    padding: 12px 14px;
    background: #0a0a0c;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    font-family: "Cascadia Code", "Fira Code", monospace;
    resize: vertical;
    line-height: 1.6;
  }
  .admin-panel textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(251,114,153,.08); }
  .admin-hint {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .admin-actions {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .admin-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--card-border);
  }
  .admin-user {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* ============ 响应式 ============ */
  @media (max-width: 640px) {
    body { padding: 16px 12px; }
    .rooms-grid { grid-template-columns: 1fr; gap: 12px; }
    .header { flex-direction: column; align-items: flex-start; }
    .header h1 { font-size: 20px; }
    .admin-panel { padding: 16px; }
  }
</style>
</head>
<body>

<!-- ============== 头部 ============== -->
<div class="header">
  <h1>📡 直播间监控</h1>
  <div class="header-controls">
    <span class="status-summary" id="statusSummary">加载中...</span>
    <span class="last-update" id="lastUpdate"></span>
    <button class="btn" id="refreshBtn" onclick="refreshAll(true)">🔄 刷新</button>
    <a class="btn" id="adminLink" href="#admin">🔒 管理</a>
  </div>
</div>

<div id="notice" class="notice"></div>

<!-- ============== 登录弹窗 ============== -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>管理员登录</h2>
    <div class="login-error" id="loginError">用户名或密码错误</div>
    <label for="loginUser">用户名</label>
    <input type="text" id="loginUser" placeholder="请输入用户名" autocomplete="username">
    <label for="loginPass">密码</label>
    <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="current-password">
    <button class="btn btn-primary" onclick="handleLogin()">登 录</button>
    <div style="text-align:center;margin-top:12px">
      <a href="#public" style="color:var(--text-secondary);font-size:13px;text-decoration:none">返回监控</a>
    </div>
  </div>
</div>

<!-- ============== 管理面板 ============== -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-bar">
    <h3>⚙️ 监控配置管理</h3>
    <div>
      <span class="admin-user" id="adminUserInfo"></span>
      <button class="btn" onclick="handleLogout()" style="margin-left:8px">退出登录</button>
      <a class="btn" href="#public">返回监控</a>
    </div>
  </div>
  <label for="adminConfig">房间列表（每行一个：平台 房间号 备注名）</label>
  <textarea id="adminConfig" spellcheck="false"></textarea>
  <div class="admin-hint">支持平台：<code>bilibili</code>（B站）、<code>douyin</code>（抖音）、<code>kuaishou</code>（快手）</div>

  <div class="admin-actions">
    <button class="btn btn-primary" onclick="adminSave()">💾 保存配置</button>
    <button class="btn" onclick="adminReset()">↩️ 恢复默认</button>
  </div>
</div>

<!-- ============== 房间网格 ============== -->
<div class="rooms-grid" id="roomsGrid">
</div>

<script>
// ===================== 管理员账号 =====================
// ⚠️ 请修改密码！注意密码明文显示在源码中（纯静态页面无后端）
const ADMIN_CREDENTIALS = {
  username: 'zx',
  password: '123',
};

// ===================== 默认配置 =====================
const DEFAULT_ROOMS = [
  { platform: 'bilibili', id: '1742439556', name: '激素猪' },
  { platform: 'bilibili', id: '10274888',   name: 'BlackDog' },
  { platform: 'bilibili', id: '3103670',    name: '烂牙' },
  { platform: 'douyin',   id: 'Ccc3392',   name: '抖音主播' },
];
const REFRESH_INTERVAL = 30000;

// ===================== 状态 =====================
let rooms = [];
let timer = null;

// ===================== 存储 =====================
function loadRooms() {
  try {
    const saved = localStorage.getItem('live_monitor_rooms');
    return saved ? JSON.parse(saved) : null;
  } catch(e) { return null; }
}
function saveRooms(r) {
  localStorage.setItem('live_monitor_rooms', JSON.stringify(r));
}

// ===================== 房间跳转链接 =====================
function getRoomUrl(platform, id) {
  const urls = {
    bilibili: 'https://live.bilibili.com/',
    douyu: 'https://www.douyu.com/',
    huya: 'https://www.huya.com/',
    kuaishou: 'https://live.kuaishou.com/u/',
    douyin: 'https://live.douyin.com/',
  };
  return (urls[platform] || 'https://live.bilibili.com/') + id;
}

// ===================== 渲染 =====================
function formatViewers(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}
function statusText(s) { return { live: '直播中', offline: '未开播', replay: '轮播中' }[s] || s; }

function renderRoom(room, data, error) {
  const url = getRoomUrl(room.platform, room.id);
  const card = document.createElement('a');
  card.href = url;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.className = 'room-card' + (data?.liveStatus === 'live' ? ' live' : '');
  const bc = data?.liveStatus === 'live' ? 'live' : data?.liveStatus === 'replay' ? 'replay' : 'offline';
  const sv = data?.liveStatus === 'live' || data?.liveStatus === 'replay';
  card.innerHTML = `
    <div class="cover-wrap">
      ${data?.cover ? `<img src="${data.cover}" alt="" loading="lazy" onerror="this.parentElement.querySelector('.placeholder').style.display='flex';this.style.display='none'">` : ''}
      <div class="placeholder" style="display:${data?.cover ? 'none' : 'flex'}">📺</div>
      <div class="live-badge ${bc}">${statusText(data?.liveStatus || '等待中')}</div>
      ${sv ? `<span class="viewer-count">👁 ${formatViewers(data.viewerCount)}</span>` : ''}
    </div>
    <div class="room-info">
      <div class="room-title ${data?.liveStatus !== 'live' ? 'offline-title' : ''}">${data?.title || (error ? '出错了' : (data ? '未开播' : '待同步'))}</div>
      <div class="room-meta">
        <div class="room-owner"><div class="avatar">${data?.avatar ? `<img src="${data.avatar}" onerror="this.style.display='none'">` : ''}</div><span>${data?.uname || room.name || room.id}</span></div>
        <span class="platform-tag ${room.platform}"><span class="platform-dot ${room.platform}"></span>${room.platform}</span>
      </div>
      ${error ? `<div class="room-error">❌ ${error}</div>` : ''}
    </div>`;
  return card;
}

function render(roomDataMap, errors) {
  const grid = document.getElementById('roomsGrid');
  grid.innerHTML = '';
  let liveCount = 0;
  rooms.forEach(room => {
    const key = room.platform + ':' + room.id;
    const data = roomDataMap[key];
    if (data?.liveStatus === 'live') liveCount++;
    grid.appendChild(renderRoom(room, data, errors[key]));
  });
  document.getElementById('statusSummary').innerHTML =
    `<span class="count-live">${liveCount}</span> 直播中 / ${rooms.length} 房间`;
}

// ===================== 数据获取 =====================
const STATUS_JSON_URL = '/status.json';

async function refreshAll() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⏳ 刷新中...';
  const roomDataMap = {}, errors = {};

  try {
    const resp = await fetch(STATUS_JSON_URL + '?t=' + Date.now());
    if (resp.ok) {
      const data = await resp.json();
      if (data.rooms && data.rooms.length > 0) {
        data.rooms.forEach(r => {
          if (r.error) errors[r.key] = r.error;
          else roomDataMap[r.key] = r;
        });
      }
    }
  } catch (_) {}

  render(roomDataMap, errors);
  document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleString('zh-CN');
  btn.disabled = false; btn.textContent = '🔄 刷新';
}

// ===================== 启动监控 =====================
function startMonitoring() {
  if (timer) clearInterval(timer);
  // 首次加载保留 SSR 预渲染卡片，JS 只负责定时刷新
  timer = setInterval(refreshAll, REFRESH_INTERVAL);
}

function initRooms() {
  const saved = loadRooms();
  rooms = saved || [...DEFAULT_ROOMS];
  startMonitoring();
}

// ===================== 认证 =====================
function isAdmin() {
  return sessionStorage.getItem('live_monitor_admin') === 'true';
}

function handleLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');

  if (!user || !pass) { errEl.textContent = '请输入用户名和密码'; errEl.style.display = 'block'; return; }

  if (user !== ADMIN_CREDENTIALS.username || pass !== ADMIN_CREDENTIALS.password) {
    errEl.textContent = '用户名或密码错误'; errEl.style.display = 'block'; return;
  }

  // 登录成功
  sessionStorage.setItem('live_monitor_admin', 'true');
  errEl.style.display = 'none';
  document.getElementById('loginOverlay').classList.remove('show');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  showAdminPanel();
}

function handleLogout() {
  sessionStorage.removeItem('live_monitor_admin');
  hideAdminPanel();
  location.hash = 'public';
}

// ============== 管理面板 ==============
function showAdminPanel() {
  const panel = document.getElementById('adminPanel');
  panel.classList.add('show');
  document.getElementById('adminUserInfo').textContent = '已登录：' + ADMIN_CREDENTIALS.username;
  document.getElementById('adminConfig').value = rooms.map(r =>
    `${r.platform} ${r.id} ${r.name || ''}`.trim()
  ).join('\n');
  document.getElementById('adminLink').textContent = '⚙️ 配置';
  document.getElementById('adminLink').href = '#admin';
}

function hideAdminPanel() {
  document.getElementById('adminPanel').classList.remove('show');
  document.getElementById('adminLink').textContent = '🔒 管理';
}

function adminSave() {
  const text = document.getElementById('adminConfig').value;
  const parsed = text.split('\n')
    .map(l => l.trim()).filter(l => l && !l.startsWith('#'))
    .map(l => { const p = l.split(/\s+/); return p.length >= 2 ? { platform: p[0].toLowerCase(), id: p[1], name: p.slice(2).join(' ') || '' } : null; })
    .filter(Boolean);
  if (parsed.length === 0) { alert('没有解析到有效房间'); return; }

  rooms = parsed;
  saveRooms(parsed);

  // 同步新房间到服务端
  fetch('/api/rooms', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'update', rooms: parsed})
  }).then(r => r.json()).then(d => {
    console.log('Server sync:', d);
    refreshAll();
    alert('✅ 配置已保存' + (d.ok ? '' : '，但服务端同步失败'));
  }).catch(() => {
    refreshAll();
    alert('✅ 配置已保存（本地）');
  });
}

function adminReset() {
  rooms = [...DEFAULT_ROOMS];
  saveRooms(DEFAULT_ROOMS);
  document.getElementById('adminConfig').value = rooms.map(r =>
    `${r.platform} ${r.id} ${r.name || ''}`.trim()
  ).join('\n');
  refreshAll();
  alert('✅ 已恢复默认配置');
}

// ===================== 路由 =====================
function handleHashChange() {
  const hash = location.hash.slice(1) || 'public';

  if (hash === 'admin') {
    if (isAdmin()) {
      document.getElementById('loginOverlay').classList.remove('show');
      showAdminPanel();
    } else {
      hideAdminPanel();
      document.getElementById('loginOverlay').classList.add('show');
      document.getElementById('loginUser').focus();
    }
  } else {
    document.getElementById('loginOverlay').classList.remove('show');
    hideAdminPanel();
  }
}

// ===================== 键盘事件 =====================
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginOverlay').classList.contains('show')) {
    handleLogin();
  }
});

// ===================== 初始化 =====================
window.addEventListener('hashchange', handleHashChange);

initRooms();

// 检查是否需要进入管理界面
if (location.hash === '#admin') {
  handleHashChange();
}</script>
</body>
